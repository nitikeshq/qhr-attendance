# QHR Attendance routes. Installed as /etc/nginx/projects.d/qhr-attendance.conf
# and included by the shared host server block.
#
# Everything this project owns lives under the /qhr/ prefix. `^~` is used so these
# prefixes always win over the shared host's catch-all, and so `/qhr` can never
# swallow another project whose name merely starts with "qhr".
#
# Reserved localhost ports for this project: 5001 (API), 3002 (site), 3003 (admin).

# Bare prefix. Proxied rather than redirected: Next.js with basePath already
# normalises /qhr/ to /qhr, so redirecting here would create a loop.
location = /qhr {
    proxy_pass http://127.0.0.1:3002;
}

# Backend API. The /qhr prefix is stripped so the app still sees /api/v1/...
location ^~ /qhr/api/ {
    rewrite ^/qhr(/api/.*)$ $1 break;
    proxy_pass http://127.0.0.1:5001;
}

location = /qhr/health {
    proxy_pass http://127.0.0.1:5001/health;
}

# Administration console (Next.js, basePath=/qhr/admin).
location ^~ /qhr/admin {
    proxy_pass http://127.0.0.1:3003;
}

# Employee web portal (static Expo export, baseUrl=/qhr/app).
location ^~ /qhr/app {
    alias /home/ubuntu/apps/qhr-attendance/attendance-mobile/dist;
    index index.html;
    try_files $uri $uri/ /qhr/app/index.html;
}

# Marketing site (Next.js, basePath=/qhr).
location ^~ /qhr/ {
    proxy_pass http://127.0.0.1:3002;
}
