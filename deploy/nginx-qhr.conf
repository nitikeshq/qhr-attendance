# QHR reverse proxy. Installed as /etc/nginx/sites-available/qhr-attendance.
# Scoped to this application only: the packaged default site is disabled so this
# server block can answer on port 80.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name ec2-3-78-219-190.eu-central-1.compute.amazonaws.com _;

    client_max_body_size 12m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;

    # Backend API and health probe.
    location /api/ {
        proxy_pass http://127.0.0.1:5001;
    }

    location = /health {
        proxy_pass http://127.0.0.1:5001/health;
    }

    # Administration console (Next.js started with basePath=/admin).
    location /admin {
        proxy_pass http://127.0.0.1:3003;
    }

    # Employee web portal (static Expo export built with baseUrl=/app).
    location /app {
        alias /home/ubuntu/apps/qhr-attendance/attendance-mobile/dist;
        index index.html;
        try_files $uri $uri/ /app/index.html;
    }

    # Marketing site at the root.
    location / {
        proxy_pass http://127.0.0.1:3002;
    }
}
