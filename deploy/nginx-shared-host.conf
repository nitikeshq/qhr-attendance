# Shared host entry point for ALL projects on this server.
# Installed as /etc/nginx/sites-available/00-shared-host (enabled).
#
# This file is project-neutral. Each project drops exactly one file into
# /etc/nginx/projects.d/<project>.conf containing only its own `location` blocks
# under its own path prefix. Adding or removing a project never touches this file
# and never affects any other project.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 25m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;

    # Per-project route files.
    include /etc/nginx/projects.d/*.conf;

    # Neutral root: a plain index of deployed projects. Owned by no project.
    location = / {
        root /var/www/shared-host;
        try_files /index.html =404;
    }

    location = /favicon.ico {
        access_log off;
        return 204;
    }

    # Anything not claimed by a project prefix.
    location / {
        return 404;
    }
}
